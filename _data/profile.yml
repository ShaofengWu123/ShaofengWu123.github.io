short_bio: >-
  <p>
    I am a Senior Researcher in the Networking Infrastructure Group at Microsoft Research Asia. Prior to this, I completed my Ph.D. at the Department of Computer Science and Engineering at The Chinese University of Hong Kong, supervised by Prof. Hong Xu, and received my bachelor's degrees in Computer Science and Material Physics from the University of Science and Technology of China (USTC).
  </p>
  <p>
    My research is primarily concentrated on systems and networking for cloud and next-generation AI infrastructure (particularly programmable dataplanes such as SmartNICs/DPUs), with a strong emphasis on deploying these technologies in real-world production environments to address practical challenges.
  </p>

